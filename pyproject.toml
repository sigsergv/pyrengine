[project]
dynamic = ["version"]
name = "pyrengine"
#version = "1.0.0"  # actual version is set via file `pyrengine/__init__.py`
description = "Personal blog engine written in Python using Flask and SqlAlchemy"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name="Sergey Stolyarov", email="sergei@regolit.com" },
]
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-Babel==4.0.0",
    "Flask-Login==0.6.3",
    "pytz",
    "markdown==3.10.3",
    "Pygments==2.20.0",
    "humanize==4.16.0",
    "lxml==6.1.1",
    "psycopg2==2.9.12",
    "pillow==12.3.0",
# pinned auto deps
    "Jinja2==3.1.6",
    "click==8.4.2",
    "blinker==1.9.0",
    "Babel==2.18.0",
    "alembic==1.19.1",
    "sqlalchemy==2.0.51",
    "Mako==1.4.1",
    "typing-extensions==4.16.0",
    "MarkupSafe==3.0.3",
    "greenlet==3.5.5"
]

#[tool.setuptools]
#package-dir = {"" = "pyrengine"}

#[tool.setuptools.packages]
#find = {}  # Scanning implicit namespaces is active by default

[tool.setuptools.dynamic]
version = {attr = "pyrengine.__version__"}

[tool.setuptools.packages.find]
exclude = ["__pycache__"]

[tool.setuptools.package-data]
# add templates recursiveley
"pyrengine.templates" = ["**/*.jinja2"]
# add everything in "pyrengine/static" directory
"pyrengine.static" = ["**/*"]
"pyrengine.examples" = ["**/*"]
"pyrengine.translations" = ["**/*"]
"pyrengine.models.migrations" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc"]


[build-system]
requires = ["setuptools >= 62.3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
"Homepage" = "https://github.com/sigsergv/pyrengine"
